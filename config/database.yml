default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

production:
  primary: &primary_production
    <<: *default
    # DATABASE_URL から接続情報を取得
    # database, username, password, host, port は自動的に解釈される
    url: <%= ENV["DATABASE_URL"] %>

  cache:
    # primary_production の設定を継承
    <<: *primary_production
    # Solid Cache のマイグレーションは db/cache_migrate/ に配置
    migrations_paths: db/cache_migrate

  cable:
    <<: *primary_production
    # Solid Cable のマイグレーションは db/cable_migrate/ に配置
    migrations_paths: db/cable_migrate

  queue:
    <<: *primary_production
    # Solid Queue のマイグレーションは db/queue_migrate/ に配置
    migrations_paths: db/queue_migrate
